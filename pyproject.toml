[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qaoa-common"
version = "0.1.0"
description = "Shared QAOA utilities: QUBO builder, circuit factory, ZNE folding, figures"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "qiskit",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["qaoa_common*"]
